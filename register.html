<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | PetID</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand auth-brand" href="index.html"><img src="PetID/wwwroot/imagenes/Logo_PetID.png" alt="">PetID</a>
    <h1>Crear cuenta</h1>
    <p class="muted center">Vista previa del formulario de registro.</p>

    <div class="notice"><strong>Versión de prueba:</strong> esta versión no permite la creación de usuarios. No hay base de datos ni almacenamiento de datos personales.</div>

    <form class="auth-form" aria-label="Vista previa del registro">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="email" placeholder="tu@email.com" disabled>
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="new-password" placeholder="Al menos 8 caracteres" disabled>
      <label for="confirm-password">Confirmar contraseña</label>
      <input id="confirm-password" type="password" autocomplete="new-password" placeholder="Repite tu contraseña" disabled>
      <button class="button full disabled-button" type="button" disabled>No disponible en esta prueba</button>
    </form>

    <p class="center">Usa el usuario de demostración en <a href="login.html">Iniciar sesión</a>.</p>
  </main>
</body>
</html>
