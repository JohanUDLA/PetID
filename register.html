<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear cuenta - PetID</title>
    <link rel="stylesheet" href="PetID/wwwroot/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="PetID/wwwroot/css/site.css" />
    <link rel="stylesheet" href="PetID/wwwroot/css/login.css?v=2" />
    <style>
        .login-container {
            background:
                radial-gradient(circle at 15% 20%, rgba(247, 194, 196, 0.52) 0 7%, transparent 7.5%),
                radial-gradient(circle at 85% 82%, rgba(99, 198, 193, 0.45) 0 9%, transparent 9.5%),
                linear-gradient(135deg, #fffaf8 0%, #f5ebe8 48%, #dff4f1 100%);
        }
        .login-container::before { background: rgba(238, 145, 140, 0.2); }
        .login-container::after { background: rgba(99, 198, 193, 0.2); }
    </style>
</head>
<body>
    <main class="login-container">
        <div class="login-wrapper">
            <section class="login-card" aria-labelledby="register-title">
                <header class="login-header text-center">
                    <a href="index.html" aria-label="Volver a PetID"><img src="PetID/wwwroot/imagenes/Logo_PetID.png" alt="Logo PetID" class="login-logo" /></a>
                    <h1 id="register-title" class="mt-3 fw-bold">Crear cuenta</h1>
                    <p class="text-muted small">Únete a PetID y protege a tus mascotas</p>
                </header>

                <div class="alert alert-warning" role="status"><strong>Versión de prueba:</strong> el registro se muestra solo como ejemplo. No es posible crear usuarios ni guardar información.</div>
                <form class="login-form" aria-label="Vista previa del registro">
                    <div class="mb-3"><label for="email" class="form-label fw-bold">Correo electrónico</label><input id="email" type="email" class="form-control register-input" autocomplete="email" placeholder="tu@email.com" disabled /></div>
                    <div class="mb-3"><label for="password" class="form-label fw-bold">Contraseña</label><input id="password" type="password" class="form-control register-input" placeholder="Al menos 8 caracteres" disabled /></div>
                    <div class="mb-4"><label for="confirm-password" class="form-label fw-bold">Confirmar contraseña</label><input id="confirm-password" type="password" class="form-control register-input" placeholder="Repite tu contraseña" disabled /></div>
                    <button type="button" class="btn btn-primary w-100 py-2 fw-bold" disabled>Crear mi cuenta</button>
                </form>
                <div class="text-center mt-4"><p class="text-muted mb-0">¿Ya tienes una cuenta? <a href="login.html" class="text-primary fw-bold text-decoration-none">Inicia sesión</a></p></div>
            </section>
        </div>
    </main>
</body>
</html>
