<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | PetID</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand auth-brand" href="index.html"><img src="PetID/wwwroot/imagenes/Logo_PetID.png" alt="">PetID</a>
    <h1>Iniciar sesión</h1>
    <p class="muted center">Accede a la demostración del dashboard.</p>
    <div class="demo-credentials"><strong>Usuario de prueba</strong><br>Correo: admin@petid.com<br>Contraseña: admin123</div>

    <form id="login-form" class="auth-form">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="username" placeholder="tu@email.com" required>
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Tu contraseña" required>
      <button class="button full" type="submit">Iniciar sesión</button>
      <p id="login-message" class="form-message" role="alert" aria-live="polite"></p>
    </form>

    <p class="center"><a href="register.html">¿No tienes cuenta? Regístrate aquí</a></p>
    <p class="center"><a href="index.html">Volver al inicio</a></p>
  </main>

  <script>
    const demoEmail = "admin@petid.com";
    const demoPassword = "admin123";

    document.getElementById("login-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const message = document.getElementById("login-message");

      if (email !== demoEmail || password !== demoPassword) {
        message.textContent = "Correo o contraseña incorrectos.";
        message.className = "form-message error";
        return;
      }

      sessionStorage.setItem("petidDemoUser", demoEmail);
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
