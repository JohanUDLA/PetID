<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - PetID</title>
    <link rel="stylesheet" href="PetID/wwwroot/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="PetID/wwwroot/css/site.css" />
    <link rel="stylesheet" href="PetID/wwwroot/css/login.css?v=2" />
    <style>
        .login-container {
            background:
                radial-gradient(circle at 15% 20%, rgba(247, 194, 196, 0.52) 0 7%, transparent 7.5%),
                radial-gradient(circle at 85% 82%, rgba(99, 198, 193, 0.45) 0 9%, transparent 9.5%),
                linear-gradient(135deg, #fffaf8 0%, #f5ebe8 48%, #dff4f1 100%);
        }
        .login-container::before { background: rgba(238, 145, 140, 0.2); }
        .login-container::after { background: rgba(99, 198, 193, 0.2); }
    </style>
</head>
<body>
    <main class="login-container">
        <div class="login-wrapper">
            <section class="login-card" aria-labelledby="login-title">
                <header class="login-header text-center">
                    <a href="index.html"><img src="PetID/wwwroot/imagenes/Logo_PetID.png" alt="PetID Logo" class="login-logo" /></a>
                    <h1 id="login-title" class="mt-3 fw-bold">PetID</h1>
                    <p class="text-muted small">Identificación Inteligente para Mascotas</p>
                </header>

                <div class="alert alert-info py-2" role="note"><strong>Usuario de prueba:</strong> admin@petid.com<br><strong>Contraseña:</strong> admin123</div>
                <div id="login-error" class="alert alert-danger" role="alert" hidden></div>

                <form id="login-form" class="login-form">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text">✉</span>
                            <input type="email" class="form-control bg-light" id="email" name="Email" value="admin@petid.com" autocomplete="username" required />
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text">●</span>
                            <input type="password" class="form-control bg-light" id="password" name="Password" value="admin123" autocomplete="current-password" required />
                        </div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe" />
                        <label class="form-check-label" for="rememberMe">Recuérdame en este dispositivo</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">Iniciar Sesión</button>
                    <div class="divider mb-3"><span>O</span></div>
                    <div class="d-grid gap-2"><button type="button" class="btn btn-outline-secondary py-2" disabled>Continuar con Google</button></div>
                </form>

                <div class="text-center mt-4"><p class="text-muted">¿No tienes cuenta? <a href="register.html" class="text-primary fw-bold text-decoration-none">Regístrate aquí</a></p></div>
                <div class="text-center mt-3 pt-3 border-top"><small class="text-muted"><a href="index.html" class="text-decoration-none text-muted">Volver a inicio</a></small></div>
            </section>
        </div>
    </main>
    <script>
        document.getElementById("login-form").addEventListener("submit", function (event) {
            event.preventDefault();
            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const error = document.getElementById("login-error");
            if (email !== "admin@petid.com" || password !== "admin123") {
                error.textContent = "Correo o contraseña incorrectos.";
                error.hidden = false;
                return;
            }
            sessionStorage.setItem("petidDemoUser", "admin@petid.com");
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
